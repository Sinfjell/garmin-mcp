[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin_mcp"
version = "0.1.0"
description = "Garmin MCP server for Claude and other AI assistants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sindre Fjellestad" }]
# Every dependency carries an upper bound, without exception. There is no
# lockfile, and the production host runs `uvx --from git+...@main`, which
# re-resolves on every restart — so an unbounded dependency means any restart
# can pull a breaking major with no code change and no warning. That is not
# hypothetical here: mcp 2.0.0 removed `mcp.server.fastmcp` and crash-looped the
# server 160+ times on 2026-08-05. Lift a ceiling only together with a port to
# the new API — never to make CI green.
dependencies = [
    # Pinned below 2.0: the MCP SDK dropped `mcp.server.fastmcp` in 2.0.0, which
    # this server imports. Lift the ceiling only together with a port to the 2.x API.
    "mcp[cli]>=1.0,<2",
    # Floor is an API requirement, not a preference: get_heart_rate_zones()
    # (get_running_threshold) landed in 0.3.7 — 0.3.3 through 0.3.6 resolve fine
    # and then return an error section at runtime. Verified against each release.
    "garminconnect>=0.3.7,<0.4",
    # Declared explicitly rather than leaned on transitively via mcp[cli]:
    # multi-tenant mode imports it directly to serve the routing app.
    "uvicorn>=0.30,<1",
    # Onboarding app. python-multipart is what lets FastAPI read the login
    # form; without it the form posts fail at runtime, not at import.
    "fastapi>=0.110,<1",
    "python-multipart>=0.0.9,<1",
    # Official OAuth path (GARMIN_AUTH_MODE=oauth): token exchange + wellness API.
    # Also pulled transitively by mcp; declared so the ceiling is explicit.
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Pinned: ruff's default rule set grows on every minor release, which turns
    # CI red on untouched code. Bump deliberately, together with the fixes the
    # new rules ask for.
    "ruff==0.16.1",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-auth = "garmin_mcp.auth:main"
garmin-mcp-onboarding = "garmin_mcp.onboarding.app:main"
garmin-mcp-tenant = "garmin_mcp.onboarding.cli:main"

[project.urls]
Homepage = "https://github.com/Sinfjell/garmin-mcp"
Repository = "https://github.com/Sinfjell/garmin-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"
